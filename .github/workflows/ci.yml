name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-test the production server
        run: |
          ROUTE_RUNNER_DATA=$RUNNER_TEMP/rr MARKET_REFRESH=off PORT=7420 node apps/server/dist/index.js &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:7420/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:7420/api/profile | grep -q Phemelo
          curl -fs http://127.0.0.1:7420/ | grep -q "Route Runner"

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render with kustomize and validate with kubeconform
        run: |
          kubectl kustomize deploy/k8s > rendered.yaml
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary rendered.yaml

  image:
    name: Build container image (push on main)
    needs: [test, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/route-runner:latest
            ghcr.io/${{ github.repository_owner }}/route-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
