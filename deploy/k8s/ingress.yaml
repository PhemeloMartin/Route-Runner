apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: route-runner
spec:
  ingressClassName: nginx
  rules:
    - host: route-runner.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: route-runner
                port:
                  name: http
