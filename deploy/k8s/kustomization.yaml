# kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: route-runner
labels:
  - pairs:
      app.kubernetes.io/part-of: route-runner
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
images:
  - name: ghcr.io/phemelomartin/route-runner
    newTag: latest
