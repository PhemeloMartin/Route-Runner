# Only the ingress controller may talk to the pod; the pod may only do DNS and HTTPS out (market data).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: route-runner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: route-runner
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 7420
  egress:
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
        - { port: 443, protocol: TCP }
